# ============================================================================
# STUB — DO NOT RUN AS-IS. Light-SFT config for Qwen3.6-35B-A3B (stronger base).
# ============================================================================
# Verified 2026-06-27. The model is REAL (Qwen/Qwen3.6-35B-A3B, Apache-2.0): 35B
# total / 3B active, 256 experts (8 routed + 1 shared), 40 layers = 30 Gated
# DeltaNet + 10 Gated Attention, MTP, 262K ctx, hybrid thinking. SWE-bench 73.4 /
# Terminal-Bench 2.0 51.5 (model claims). SERVING the quant locally is confirmed.
# But TRAINING it is a bleeding-edge, version-gated path — resolve these FIRST:
#
#   1. NOT a plain coder model. It loads as `Qwen3_5MoeForConditionalGeneration`
#      (natively MULTIMODAL — ships a vision encoder). Your trainer must handle the
#      conditional-generation/multimodal wrapper + its processor/chat template, not
#      a plain ForCausalLM. (Pure-coder analog = the separate Qwen3-Coder-30B-A3B.)
#   2. TOOLING PINS: transformers very recent (DeltaNet/MoE kernels); vLLM >=0.17.0
#      to serve; llama.cpp latest for Gated DeltaNet ops; MLX is inference-only.
#      Axolotl has a Qwen3-Next QLoRA example (~47 GiB w/o experts, ~71 GiB with).
#   3. MTP HEAD vs PACKING: MTP is INCOMPATIBLE with sequence packing. So either
#      keep sample_packing:false (below) OR drop MTP — do NOT enable both. Stock
#      ForCausalLM SFT also won't train the MTP head (it may drift; re-tune later).
#   4. Tool-call format: re-check the 3.6 chat template — it likely differs from the
#      30B's qwen3_xml parser. Convert trajectories to whatever 3.6 actually emits.
#   5. Gate on a baseline eval FIRST, in BOTH thinking + non-thinking modes (the
#      73.4 is a thinking-mode number; serving non-thinking may forfeit it).
#
# Philosophy (§8.2): stronger base = little headroom = go LIGHT on imitation SFT
# (risk = degrading it); shift weight to verifier + best-of-N + RL/RFT.
# ============================================================================

base_model: Qwen/Qwen3.6-35B-A3B
trust_remote_code: true

load_in_4bit: true
adapter: qlora
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
# CRITICAL — re-derive from the real model BEFORE running:
#   python -c "from transformers import AutoModelForCausalLM as M; \
#     [print(n) for n,_ in M.from_pretrained('Qwen/Qwen3.6-35B-A3B').named_modules()]"
# Only the 10 Gated-Attention layers have q/k/v/o_proj. The 30 DeltaNet layers use
# DIFFERENT names — `in_proj_qkvz`, `in_proj_ba` (the input proj is SPLIT in two,
# there is no single `in_proj`), and `out_proj`. List those too or LoRA adapts
# almost nothing. `conv1d`, `A_log`, `dt_bias` are conv/param tensors = FULL-FT-ONLY
# (not LoRA-able). Freeze the router `mlp.gate` and `shared_expert_gate`.
lora_target_modules:
  - q_proj          # 10 attention layers only
  - k_proj
  - v_proj
  - o_proj
  - in_proj_qkvz    # 30 DeltaNet layers — VERIFY exact names via named_modules()
  - in_proj_ba
  - out_proj
  # add expert MLPs (gate_proj/up_proj/down_proj incl. the shared expert) only after
  # a clean attention+deltanet eval — they multiply adapter size by the expert count.

chat_template: tokenizer_default     # TODO: confirm 3.6 template vs 30B
datasets:
  - path: data/sft_train.jsonl       # Track B: rebuild light (small --max-examples, drop exec-free)
    type: chat_template
    field_messages: messages
    roles_to_train: ["assistant"]
    train_on_eos: turn

dataset_prepared_path: data/.axolotl_prepared_36
val_set_size: 0.02
output_dir: outputs/qwen36-35b-a3b-qlora

sequence_len: 16384
sample_packing: false        # MTP head is incompatible with packing (see header #3)
pad_to_sequence_len: true

micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 1                # light — one pass over a high-quality, verified-only mix
optimizer: adamw_torch_fused
lr_scheduler: cosine
learning_rate: 0.00005       # 3e-5–7e-5 band for a strong base (vs 1e-4 on the 30B)
warmup_ratio: 0.03
max_grad_norm: 1.0

bf16: true
tf32: true
flash_attention: true        # NOTE: DeltaNet layers use their own kernel, not flash-attn
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

logging_steps: 1
save_strategy: steps
save_steps: 50
save_total_limit: 3
evals_per_epoch: 1

special_tokens:
  pad_token: "<|endoftext|>"
